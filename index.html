<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Карта событий</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
  <style>
    html,body,#map{height:100%;margin:0}
    #filters{position:absolute;top:10px;right:10px;z-index:1000;background:#fff;
             padding:10px 14px;border-radius:8px;box-shadow:0 1px 8px rgba(0,0,0,.3);
             font-family:system-ui,sans-serif;font-size:14px}
    #filters label{display:block;cursor:pointer;margin:2px 0}
    .region-popup { font-family: system-ui, sans-serif; font-size: 14px;}
    .region-popup h3 { margin: 0 0 5px 0; }
    .region-popup ul { margin: 0; padding-left: 20px; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="filters">
  <label><input type="checkbox" data-kind="дрон" checked> БПЛА</label>
  <label><input type="checkbox" data-kind="ракета" checked> Ракеты</label>
  <label><input type="checkbox" data-kind="событие" checked> События</label>
  <label>за последние:
    <select id="hours">
      <option value="1">1 час</option>
      <option value="6">6 часов</option>
      <option value="24">24 часа</option>
      <option value="168" selected>7 дней</option>
    </select>
  </label>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const map = L.map('map').setView([49.5, 34], 6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

const cluster = L.markerClusterGroup();
map.addLayer(cluster);

const COLORS = { "дрон": "#e74c3c", "ракета": "#8e44ad", "событие": "#f39c12" };
let allEvents = [];
let activeKinds = new Set(["дрон","ракета","событие"]);
let hours = 168;

// Слой для областей
let regionLayer = L.geoJSON(null, {
  style: function(feature) {
    return { color: "#888", weight: 1, fillOpacity: 0.1, fillColor: "#3388ff" };
  },
  onEachFeature: function(feature, layer) {
    layer.on('click', function() {
      const regionName = feature.properties.name;
      const evs = allEvents.filter(e => e.region && e.region.includes(regionName) || (e.region && regionName.includes(e.region)));
      
      const activeEvs = evs.filter(e => {
        const evTime = new Date(e.ts).getTime();
        return (new Date().getTime() - evTime <= hours * 3600 * 1000) && activeKinds.has(e.kind);
      });

      if (activeEvs.length === 0) {
        layer.bindPopup(`<div class="region-popup"><h3>${regionName}</h3><p>Нет активных событий</p></div>`).openPopup();
        return;
      }

      let listHtml = "<ul>";
      activeEvs.forEach(e => {
        const dt = new Date(e.ts).toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
        listHtml += `<li><b>${e.kind.toUpperCase()}</b> (${dt}): ${e.text.slice(0, 50)}...</li>`;
      });
      listHtml += "</ul>";
      
      layer.bindPopup(`<div class="region-popup"><h3>${regionName}</h3>${listHtml}</div>`).openPopup();
    });
  }
}).addTo(map);

// Загружаем границы областей России с открытого источника
fetch('https://raw.githubusercontent.com/BorisBail/Geodata/master/russia.geojson')
  .then(r => r.json())
  .then(data => {
    regionLayer.addData(data);
  }).catch(e => console.log("Не загрузились регионы:", e));

function fetchData() {
  fetch('./data.json')
    .then(r => r.json())
    .then(d => { allEvents = d; render(); updateRegions(); })
    .catch(e => console.error(e));
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
}

function updateRegions() {
  regionLayer.eachLayer(layer => {
    const regionName = layer.feature.properties.name;
    const activeEvs = allEvents.filter(e => {
      const matchRegion = e.region && (e.region.includes(regionName) || regionName.includes(e.region));
      const evTime = new Date(e.ts).getTime();
      return matchRegion && (new Date().getTime() - evTime <= hours * 3600 * 1000) && activeKinds.has(e.kind);
    });

    let fillColor = "#3388ff";
    let fillOpacity = 0.05;
    
    if (activeEvs.length > 0) {
      if (activeEvs.some(e => e.kind === "ракета")) fillColor = "#8e44ad";
      else if (activeEvs.some(e => e.kind === "дрон")) fillColor = "#e74c3c";
      else fillColor = "#f39c12";
      fillOpacity = 0.3;
    }
    
    layer.setStyle({ fillColor, fillOpacity });
  });
}

function render() {
  cluster.clearLayers();
  for (const ev of allEvents) {
    if (!ev.lat || !ev.lon) continue;
    if (!activeKinds.has(ev.kind)) continue;
    
    const evTime = new Date(ev.ts).getTime();
    const now = new Date().getTime();
    if (now - evTime > hours * 3600 * 1000) continue;

    const color = COLORS[ev.kind] || "#666";
    const m = L.circleMarker([ev.lat, ev.lon], {
      radius: 6 + (ev.confidence || 0.5)*4, color,
      fillColor: color, fillOpacity: 0.65, weight: 1
    });
    const time = new Date(ev.ts).toLocaleString('ru-RU');
    m.bindPopup(
      `<b>${ev.kind}</b> · ${ev.place || ev.region || "?"}<br>${time}<br><br>` +
      `${esc(ev.text).slice(0,400)}<br><br>` +
      `<i>канал: ${ev.channel}</i>`
    );
    cluster.addLayer(m);
  }
}

document.querySelectorAll('#filters input[type=checkbox]').forEach(cb => {
  cb.addEventListener('change', () => {
    activeKinds = new Set([...document.querySelectorAll('#filters input:checked')]
      .map(x => x.dataset.kind));
    render();
    updateRegions();
  });
});
document.getElementById('hours').addEventListener('change', e => {
  hours = +e.target.value; render(); updateRegions();
});

fetchData();
setInterval(fetchData, 300000);
</script>
</body>
</html>
